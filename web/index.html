<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiDAR — облако точек</title>
<style>
  :root {
    --bg: #05070c;
    --panel: rgba(12, 15, 24, 0.62);
    --panel-border: rgba(140, 160, 200, 0.18);
    --fg: #dde4f0;
    --dim: #8a97b0;
    --accent: #7fb2ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { font: 13px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--fg); }
  #view { display: block; width: 100vw; height: 100vh; }

  #panel {
    position: fixed; top: 12px; left: 12px; width: 292px; max-height: calc(100vh - 24px);
    overflow-y: auto; padding: 12px 12px 14px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px;
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    box-shadow: 0 8px 28px rgba(0, 0, 0, .45);
  }
  #panel.hidden { display: none; }
  #hud { white-space: pre-line; font-family: "Cascadia Mono", Consolas, monospace;
         font-size: 12px; color: var(--accent); margin-bottom: 10px; }
  .group { border-top: 1px solid rgba(140, 160, 200, .14); padding-top: 9px; margin-top: 9px; }
  .group:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
  .label { color: var(--dim); font-size: 11px; letter-spacing: .06em;
           text-transform: uppercase; margin-bottom: 6px; }
  .btns { display: flex; flex-wrap: wrap; gap: 4px; }
  button {
    flex: 1 1 auto; min-width: 44px; padding: 5px 7px; cursor: pointer;
    color: var(--fg); background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(140, 160, 200, .22); border-radius: 6px; font: inherit;
  }
  button:hover { background: rgba(255, 255, 255, .15); }
  button.active { background: rgba(127, 178, 255, .28); border-color: var(--accent); }
  input[type=range] { width: 100%; margin: 5px 0 2px; accent-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .row > span:first-child { color: var(--dim); flex: 0 0 96px; font-size: 12px; }
  .row > input[type=range] { flex: 1 1 auto; width: auto; }
  .row b { flex: 0 0 34px; text-align: right; font-weight: 600; font-size: 12px; }
  select {
    width: 100%; padding: 5px 7px; color: var(--fg); font: inherit;
    background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(140, 160, 200, .22); border-radius: 6px;
  }
  #legend div { display: flex; align-items: center; gap: 8px; margin: 3px 0; font-size: 12px; }
  #legend i { width: 14px; height: 14px; border-radius: 3px; flex: 0 0 14px;
              border: 1px solid rgba(0, 0, 0, .5); }
  #hint {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    padding: 6px 12px; border-radius: 8px; color: var(--dim); font-size: 12px;
    background: var(--panel); border: 1px solid var(--panel-border);
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    white-space: nowrap;
  }
  #err { position: fixed; top: 12px; right: 12px; max-width: 46vw; padding: 10px 12px;
         background: rgba(90, 12, 12, .85); border-radius: 8px; display: none;
         white-space: pre-wrap; font-family: Consolas, monospace; font-size: 12px; }
  #section {
    position: fixed; right: 12px; bottom: 12px; width: 380px; height: 240px;
    border-radius: 10px; border: 1px solid var(--panel-border);
    box-shadow: 0 8px 28px rgba(0, 0, 0, .45);
  }
</style>
<script type="importmap">
{ "imports": { "three": "./three.module.min.js" } }
</script>
</head>
<body>
<canvas id="view"></canvas>

<div id="panel">
  <div id="hud">загрузка…</div>

  <div class="group">
    <div class="label">Камера</div>
    <div class="btns" id="presets"></div>
  </div>

  <div class="group">
    <div class="label">Воспроизведение</div>
    <div class="btns">
      <button id="play">Пауза</button>
      <button data-step="-10">−10</button>
      <button data-step="-1">−1</button>
      <button data-step="1">+1</button>
      <button data-step="10">+10</button>
    </div>
    <input type="range" id="frame" min="0" max="0" step="1" value="0">
    <label class="row"><span>Скорость, Гц</span>
      <input type="range" id="fps" min="1" max="30" step="1" value="10"><b id="fpsVal">10</b></label>
    <label class="row"><input type="checkbox" id="realtime"><span>реальное время (по таймстемпам)</span></label>
  </div>

  <div class="group">
    <div class="label">Раскраска</div>
    <select id="mode"></select>
  </div>

  <div class="group">
    <div class="label">Рельсы (модель, 3 шт)</div>
    <label class="row"><span>Ось X, м</span>
      <input type="range" id="axis" min="-2" max="7" step="0.02" value="3.3"><b id="axisVal">3.30</b></label>
    <label class="row"><span>Колея, мм</span>
      <input type="range" id="gauge" min="1000" max="1600" step="5" value="1520"><b id="gaugeVal">1520</b></label>
    <label class="row"><input type="checkbox" id="contact" checked><span>контактный рельс сбоку</span></label>
    <label class="row"><span>Смещение, м</span>
      <input type="range" id="coff" min="0.30" max="2.50" step="0.02" value="1.46"><b id="coffVal">1.46</b></label>
    <label class="row"><input type="checkbox" id="cside" checked><span>контактный со стороны +X</span></label>
    <div style="color:#8a97b0;font-size:11px;margin-top:4px">
      Ходовые рельсы: ось ± колея/2. Контактный: ось + смещение.<br>
      Пол пересчитывается по полосе вокруг оси.
    </div>
  </div>

  <div class="group">
    <label class="row"><span>Размер точки</span>
      <input type="range" id="psize" min="1" max="12" step="0.5" value="3"><b id="psizeVal">3</b></label>
    <label class="row"><span>Дальность, м</span>
      <input type="range" id="dist" min="5" max="200" step="5" value="40"><b id="distVal">40</b></label>
    <label class="row"><input type="checkbox" id="grid" checked><span>сетка</span></label>
    <label class="row"><input type="checkbox" id="axes" checked><span>оси</span></label>
    <label class="row"><input type="checkbox" id="additive"><span>плотная заливка</span></label>
  </div>

  <div class="group">
    <div class="label">Легенда</div>
    <div id="legend"></div>
  </div>
</div>

<div id="hint">ЛКМ — поворот, ПКМ/средняя — сдвиг, колесо — зум &nbsp;·&nbsp; Space — пауза, ←/→ — кадр, Tab — панель</div>
<canvas id="section" width="380" height="240"></canvas>
<div id="err"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
